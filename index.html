<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Painel de Estudos</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: var(--primary);
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .timer-display {
      font-size: 3rem;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
      color: #111827;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      background-color: var(--primary);
      color: white;
      transition: background 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button.secondary {
      background-color: #6b7280;
    }
    form {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr auto;
    }
    input {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }
    th {
      background-color: #f9fafb;
    }
    .sync-status {
      text-align: center;
      font-size: 0.85rem;
      color: #059669;
      margin-bottom: 15px;
    }
  </style>

  <!-- Bibliotecas do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <h1>📚 Painel de Estudos</h1>
    <div class="sync-status" id="status">⚡ Sincronizado em Tempo Real com o Firebase</div>

    <!-- Cronômetro -->
    <div class="card">
      <h2>Cronômetro de Estudos</h2>
      <div class="timer-display" id="timer">00:00:00</div>
      <div class="btn-group">
        <button id="btnStart" onclick="startTimer()">Iniciar</button>
        <button id="btnPause" onclick="pauseTimer()" class="secondary" disabled>Pausar</button>
        <button onclick="resetTimer()" class="secondary">Zerar</button>
      </div>
    </div>

    <!-- Registrar Registro de Estudo -->
    <div class="card">
      <h2>Registrar Sessão de Estudo</h2>
      <form id="studyForm" onsubmit="salvarRegistro(event)">
        <input type="text" id="materia" placeholder="Matéria (ex: Direito)" required>
        <input type="number" id="questoes" placeholder="Nº de Questões / Acertos" required>
        <button type="submit">Salvar Registro</button>
      </form>
    </div>

    <!-- Histórico de Estudos Sincronizado -->
    <div class="card">
      <h2>Histórico de Estudos</h2>
      <table>
        <thead>
          <tr>
            <th>Matéria</th>
            <th>Acertos/Questões</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="historicoTabela">
          <tr><td colspan="3">Carregando dados...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Configuração do Firebase do Usuário
    const firebaseConfig = {
      apiKey: "AIzaSyCIPK3YBKulMbjJzm_UahdtQrNjgqLmYho",
      authDomain: "plataforma-de-estudos-98ec8.firebaseapp.com",
      databaseURL: "https://plataforma-de-estudos-98ec8-default-rtdb.firebaseio.com",
      projectId: "plataforma-de-estudos-98ec8",
      storageBucket: "plataforma-de-estudos-98ec8.firebasestorage.app",
      messagingSenderId: "237117351737",
      appId: "1:237117351737:web:32a01ded955abc3d302ae8"
    };

    // Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Referência do Firebase para escutar alterações em tempo real
    db.ref('estudos/').on('value', (snapshot) => {
      const dados = snapshot.val();
      renderizarTabela(dados);
    });

    // Função para Salvar Novo Registro no Firebase
    function salvarRegistro(e) {
      e.preventDefault();
      const materia = document.getElementById('materia').value;
      const questoes = document.getElementById('questoes').value;

      const novoId = db.ref('estudos/').push().key;
      db.ref('estudos/' + novoId).set({
        materia: materia,
        questoes: questoes
      });

      document.getElementById('studyForm').reset();
    }

    // Função para Excluir Registro do Firebase
    function deletarRegistro(id) {
      db.ref('estudos/' + id).remove();
    }

    // Renderizar tabela de histórico na tela
    function renderizarTabela(dados) {
      const tabela = document.getElementById('historicoTabela');
      tabela.innerHTML = '';

      if (!dados) {
        tabela.innerHTML = '<tr><td colspan="3">Nenhum registro encontrado.</td></tr>';
        return;
      }

      Object.keys(dados).forEach((key) => {
        const item = dados[key];
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.materia}</td>
          <td>${item.questoes}</td>
          <td><button onclick="deletarRegistro('${key}')" class="secondary" style="background:#ef4444;">Excluir</button></td>
        `;
        tabela.appendChild(tr);
      });
    }

    // Lógica do Cronômetro
    let timerInterval;
    let seconds = 0;

    function updateTimerDisplay() {
      const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `${hrs}:${mins}:${secs}`;
    }

    function startTimer() {
      document.getElementById('btnStart').disabled = true;
      document.getElementById('btnPause').disabled = false;
      timerInterval = setInterval(() => {
        seconds++;
        updateTimerDisplay();
      }, 1000);
    }

    function pauseTimer() {
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnPause').disabled = true;
      clearInterval(timerInterval);
    }

    function resetTimer() {
      pauseTimer();
      seconds = 0;
      updateTimerDisplay();
    }
  </script>
</body>
</html>
